name: Publish Hawthorne.Analyzers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "NuGet package version, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PACKAGE_SOURCE: https://nuget.pkg.github.com/jorgeleo/index.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Test
        run: dotnet test Hawthorne.sln --configuration Release
      - name: Pack
        run: dotnet pack src/Hawthorne.Analyzers/Hawthorne.Analyzers.csproj --configuration Release --no-build --output artifacts/packages -p:Version=${{ steps.version.outputs.value }}
      - name: Publish to GitHub Packages
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source "$PACKAGE_SOURCE" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
